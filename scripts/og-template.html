<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OG — Есть идея</title>
<style>
  @font-face {
    font-family: 'Manrope';
    font-weight: 400 800;
    src: url('../public/fonts/manrope-cyrillic.woff2') format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: 'Manrope';
    font-weight: 400 800;
    src: url('../public/fonts/manrope-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+2000-206F, U+2191, U+2193;
  }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #f6f2ea; color: #171511;
    font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(23,21,17,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(23,21,17,.05) 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(ellipse at 85% 15%, #000 0%, transparent 70%);
    mask-image: radial-gradient(ellipse at 85% 15%, #000 0%, transparent 70%);
  }
  .inner { position: absolute; inset: 72px 80px 64px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { font-size: 118px; font-weight: 800; letter-spacing: -0.045em; line-height: 0.95; }
  .brand span { color: #f26b1d; }
  .promise { margin-top: 28px; font-size: 38px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; max-width: 22ch; color: #37332c; }
  .ladder { display: flex; align-items: center; gap: 18px; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .ladder .node { display: flex; align-items: center; gap: 12px; }
  .ladder .dot { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid #171511; background: #f6f2ea; }
  .ladder .node:last-child .dot { background: #f26b1d; border-color: #f26b1d; }
  .ladder .arrow { color: #b3480a; font-weight: 800; }
  .rule { height: 1px; background: #b9ae99; margin-bottom: 28px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="inner">
    <div>
      <div class="brand">Есть идея<span>.</span></div>
      <div class="promise">Превращаем идеи в работающие продукты и бизнесы.</div>
    </div>
    <div>
      <div class="rule"></div>
      <div class="ladder">
        <div class="node"><span class="dot"></span>Идея</div><span class="arrow">→</span>
        <div class="node"><span class="dot"></span>Структура</div><span class="arrow">→</span>
        <div class="node"><span class="dot"></span>Продукт</div><span class="arrow">→</span>
        <div class="node"><span class="dot"></span>Бизнес</div>
      </div>
    </div>
  </div>
</body>
</html>
